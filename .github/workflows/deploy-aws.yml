name: Deploy VoteX to AWS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}

jobs:
  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push client image
        uses: docker/build-push-action@v5
        with:
          context: ./client
          file: ./client/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/votex-client:latest
            ${{ secrets.DOCKER_USERNAME }}/votex-client:${{ github.sha }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/votex-client:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/votex-client:buildcache,mode=max

      - name: Build and push server image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/votex-server:latest
            ${{ secrets.DOCKER_USERNAME }}/votex-server:${{ github.sha }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/votex-server:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/votex-server:buildcache,mode=max

  deploy:
    name: Deploy to AWS EC2
    needs: build-and-push
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to AWS EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.AWS_INSTANCE_IP }}
          username: ubuntu
          key: ${{ secrets.AWS_SSH_PRIVATE_KEY }}
          script: |
            cd /home/ubuntu/votex
            
            # Pull latest images
            docker pull ${{ secrets.DOCKER_USERNAME }}/votex-client:latest
            docker pull ${{ secrets.DOCKER_USERNAME }}/votex-server:latest
            
            # Stop and remove existing containers
            docker-compose down || true
            
            # Start containers with latest images
            docker-compose up -d
            
            # Clean up old images
            docker image prune -f

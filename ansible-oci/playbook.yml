---
- name: Deploy VoteX Application on Oracle Cloud Infrastructure
  hosts: votex
  become: yes
  gather_facts: yes

  vars:
    docker_username: "{{ lookup('env', 'DOCKER_USERNAME') }}"
    docker_password: "{{ lookup('env', 'DOCKER_PASSWORD') }}"
    app_dir: "/home/ubuntu/votex"

  tasks:
    - name: Wait for cloud-init to complete
      command: cloud-init status --wait
      changed_when: false
      failed_when: false
      timeout: 300

    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install required system packages
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
          - python3-pip
          - iptables-persistent
        state: present

    - name: Check if Docker is installed
      command: docker --version
      register: docker_installed
      failed_when: false
      changed_when: false

    - name: Add Docker GPG key
      apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present
      when: docker_installed.rc != 0

    - name: Add Docker repository
      apt_repository:
        repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present
      when: docker_installed.rc != 0

    - name: Install Docker
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
        state: present
        update_cache: yes
      when: docker_installed.rc != 0

    - name: Check if Docker Compose is installed
      command: docker-compose --version
      register: compose_installed
      failed_when: false
      changed_when: false

    - name: Install Docker Compose
      get_url:
        url: "https://github.com/docker/compose/releases/latest/download/docker-compose-linux-x86_64"
        dest: /usr/local/bin/docker-compose
        mode: '0755'
      when: compose_installed.rc != 0

    - name: Create symbolic link for docker-compose
      file:
        src: /usr/local/bin/docker-compose
        dest: /usr/bin/docker-compose
        state: link
      when: compose_installed.rc != 0
      ignore_errors: yes

    - name: Add ubuntu user to docker group
      user:
        name: ubuntu
        groups: docker
        append: yes

    - name: Ensure Docker service is running
      systemd:
        name: docker
        state: started
        enabled: yes

    - name: Reset SSH connection to apply docker group
      meta: reset_connection

    - name: Configure firewall rules (idempotent)
      shell: |
        iptables -C INPUT -p tcp --dport 22 -j ACCEPT 2>/dev/null || iptables -I INPUT 1 -p tcp --dport 22 -j ACCEPT
        iptables -C INPUT -p tcp --dport 3000 -j ACCEPT 2>/dev/null || iptables -A INPUT -p tcp --dport 3000 -j ACCEPT
        iptables -C INPUT -p tcp --dport 4000 -j ACCEPT 2>/dev/null || iptables -A INPUT -p tcp --dport 4000 -j ACCEPT
        iptables-save > /etc/iptables/rules.v4 2>/dev/null || true
      changed_when: false
      ignore_errors: yes

    - name: Create application directory
      file:
        path: "{{ app_dir }}"
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: '0755'

    - name: Check if .env.production file exists locally
      stat:
        path: "{{ playbook_dir }}/../.env.production"
      register: env_file
      delegate_to: localhost
      become: no

    - name: Copy .env.production file if it exists
      copy:
        src: "{{ playbook_dir }}/../.env.production"
        dest: "{{ app_dir }}/.env.production"
        owner: ubuntu
        group: ubuntu
        mode: '0644'
      when: env_file.stat.exists

    - name: Copy docker-compose.yml
      copy:
        src: "{{ playbook_dir }}/../docker-compose.yml"
        dest: "{{ app_dir }}/docker-compose.yml"
        owner: ubuntu
        group: ubuntu
        mode: '0644'

    - name: Login to Docker Hub
      community.docker.docker_login:
        username: "{{ docker_username }}"
        password: "{{ docker_password }}"
      become: yes
      become_user: ubuntu
      when: docker_username != "" and docker_password != ""

    - name: Pull latest Docker images
      community.docker.docker_image:
        name: "{{ item }}"
        source: pull
        force_source: yes
      loop:
        - "{{ docker_username }}/votex-client:latest"
        - "{{ docker_username }}/votex-server:latest"
        - "mysql:8.4"
      become: yes
      become_user: ubuntu
      when: docker_username != ""

    - name: Stop existing containers
      community.docker.docker_compose_v2:
        project_src: "{{ app_dir }}"
        state: absent
      become: yes
      become_user: ubuntu
      ignore_errors: yes

    - name: Start VoteX application with Docker Compose
      community.docker.docker_compose_v2:
        project_src: "{{ app_dir }}"
        state: present
        pull: always
        remove_orphans: yes
      become: yes
      become_user: ubuntu

    - name: Wait for application to be ready
      wait_for:
        host: localhost
        port: "{{ item }}"
        delay: 10
        timeout: 60
        state: started
      loop:
        - 3000
        - 4000

    - name: Verify backend health
      uri:
        url: "http://localhost:4000/api/health"
        method: GET
        status_code: 200
      register: health_check
      retries: 5
      delay: 5
      until: health_check.status == 200
      ignore_errors: yes

    - name: Display deployment information
      debug:
        msg:
          - "✅ VoteX deployed successfully on Oracle Cloud!"
          - "🌐 Frontend: http://{{ ansible_default_ipv4.address }}:3000"
          - "🔗 Backend: http://{{ ansible_default_ipv4.address }}:4000"
          - "💚 Health Check: http://{{ ansible_default_ipv4.address }}:4000/api/health"

    - name: Logout from Docker Hub
      community.docker.docker_login:
        state: absent
      become: yes
      become_user: ubuntu
      when: docker_username != ""

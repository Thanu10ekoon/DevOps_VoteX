---
- name: Deploy VoteX Application
  hosts: votex_servers
  become: yes
  vars:
    app_directory: /home/ubuntu/votex
    docker_hub_username: "{{ lookup('env', 'DOCKER_USERNAME') }}"
    
  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install required packages
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
          - python3-pip
          - nginx
        state: present

    - name: Install Docker Python library
      pip:
        name:
          - docker
        state: present

    - name: Ensure Docker is running
      service:
        name: docker
        state: started
        enabled: yes

    - name: Add ubuntu user to docker group
      user:
        name: ubuntu
        groups: docker
        append: yes

    - name: Create application directory
      file:
        path: "{{ app_directory }}"
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: '0755'

    - name: Copy docker-compose.yml
      copy:
        src: ../docker-compose.yml
        dest: "{{ app_directory }}/docker-compose.yml"
        owner: ubuntu
        group: ubuntu
        mode: '0644'

    - name: Check if .env.production exists
      stat:
        path: "../.env.production"
      register: env_file
      delegate_to: localhost

    - name: Copy .env file
      copy:
        src: ../.env.production
        dest: "{{ app_directory }}/.env"
        owner: ubuntu
        group: ubuntu
        mode: '0600'
      when: env_file.stat.exists

    - name: Login to Docker Hub
      docker_login:
        username: "{{ docker_hub_username }}"
        password: "{{ lookup('env', 'DOCKER_PASSWORD') }}"
      become_user: ubuntu

    - name: Pull latest Docker images
      docker_image:
        name: "{{ docker_hub_username }}/votex-{{ item }}"
        tag: latest
        source: pull
      loop:
        - client
        - server
      become_user: ubuntu

    - name: Stop existing containers
      community.docker.docker_compose_v2:
        project_src: "{{ app_directory }}"
        state: absent
      become_user: ubuntu
      ignore_errors: yes

    - name: Start Docker Compose services
      community.docker.docker_compose_v2:
        project_src: "{{ app_directory }}"
        state: present
        pull: always
      become_user: ubuntu

    - name: Configure Nginx reverse proxy
      copy:
        dest: /etc/nginx/sites-available/votex
        content: |
          server {
              listen 80;
              server_name _;
              
              location / {
                  proxy_pass http://localhost:3000;
                  proxy_http_version 1.1;
                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection 'upgrade';
                  proxy_set_header Host $host;
                  proxy_cache_bypass $http_upgrade;
              }
          }
        mode: '0644'

    - name: Enable Nginx site
      file:
        src: /etc/nginx/sites-available/votex
        dest: /etc/nginx/sites-enabled/votex
        state: link

    - name: Remove default Nginx site
      file:
        path: /etc/nginx/sites-enabled/default
        state: absent

    - name: Restart Nginx
      service:
        name: nginx
        state: restarted
        enabled: yes

    - name: Wait for services to be healthy
      wait_for:
        port: "{{ item }}"
        delay: 10
        timeout: 60
      loop:
        - 3000
        - 4000

    - name: Display application URLs
      debug:
        msg:
          - "Frontend: http://{{ ansible_host }} (redirects to port 3000)"
          - "Frontend Direct: http://{{ ansible_host }}:3000"
          - "Backend API: http://{{ ansible_host }}:4000"
          - "Health Check: http://{{ ansible_host }}:4000/api/health"

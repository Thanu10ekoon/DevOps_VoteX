version: '3.9'
services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
    volumes:
      - db_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - votex-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 10
  server:
    build: ./server
    environment:
      PORT: 4000
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: rootpassword
      DB_NAME: votex
      JWT_SECRET: devsecret
    depends_on:
      db:
        condition: service_healthy
    networks:
      - votex-network
    ports:
      - "4000:4000"
  client:
    build: ./client
    depends_on:
      - server
    networks:
      - votex-network
    ports:
      - "3000:80"
volumes:
  db_data:
networks:
  votex-network:
    driver: bridge

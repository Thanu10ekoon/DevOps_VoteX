#cloud-config

# VoteX Server Initialization Script for Oracle Cloud Infrastructure
# Minimal setup - disable Ubuntu firewall, rely on OCI Security Lists

package_update: true
package_upgrade: false

packages:
  - apt-transport-https
  - ca-certificates
  - curl
  - python3
  - python3-pip

# System configuration for Docker
write_files:
  - path: /etc/sysctl.d/99-votex.conf
    content: |
      # VoteX system optimizations
      net.ipv4.ip_forward = 1
      net.ipv4.conf.all.forwarding = 1
    permissions: '0644'

# Apply sysctl settings and disable Ubuntu firewall
bootcmd:
  - sysctl -p /etc/sysctl.d/99-votex.conf
  - iptables -F
  - iptables -X
  - iptables -P INPUT ACCEPT
  - iptables -P FORWARD ACCEPT
  - iptables -P OUTPUT ACCEPT

runcmd:
  # Disable Ubuntu's iptables permanently - use OCI Security Lists instead
  - iptables -F
  - iptables -X
  - iptables -P INPUT ACCEPT
  - iptables -P FORWARD ACCEPT
  - iptables -P OUTPUT ACCEPT
  - netfilter-persistent flush || true
  - systemctl stop netfilter-persistent || true
  - systemctl disable netfilter-persistent || true
  
  # Create directory for VoteX application
  - mkdir -p /home/ubuntu/votex
  - chown ubuntu:ubuntu /home/ubuntu/votex

# Final message
final_message: "VoteX OCI server ready! Ubuntu firewall disabled, using OCI Security Lists."
final_message: "VoteX OCI server initialization complete! System ready after $UPTIME seconds. Docker version: $(docker --version)"

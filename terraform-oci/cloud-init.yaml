#cloud-config

# VoteX Server Initialization Script for Oracle Cloud Infrastructure
# Minimal setup - Ansible will handle Docker installation and firewall config

package_update: true
package_upgrade: false

packages:
  - apt-transport-https
  - ca-certificates
  - curl
  - python3
  - python3-pip

# System configuration for Docker
write_files:
  - path: /etc/sysctl.d/99-votex.conf
    content: |
      # VoteX system optimizations
      net.ipv4.ip_forward = 1
      net.ipv4.conf.all.forwarding = 1
    permissions: '0644'

# Apply sysctl settings
bootcmd:
  - sysctl -p /etc/sysctl.d/99-votex.conf

runcmd:
  # Create directory for VoteX application
  - mkdir -p /home/ubuntu/votex
  - chown ubuntu:ubuntu /home/ubuntu/votex

# Final message
final_message: "VoteX OCI server base initialization complete! Ansible will handle Docker setup."
final_message: "VoteX OCI server initialization complete! System ready after $UPTIME seconds. Docker version: $(docker --version)"
